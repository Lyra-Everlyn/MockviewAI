# MockviewAI — Local: chỉ chạy MySQL + Redis, app chạy bằng Visual Studio / dotnet run.
# Dùng: đổi tên thành docker-compose.yml (không commit đè bản production), cần MYSQL_ROOT_PASSWORD trong .env,
# rồi chạy: docker compose up -d

services:

  db_mockview:
    image: mysql:8.0
    container_name: mysql_mockview_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: mockview_database
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_mockview:
    image: redis:alpine
    container_name: redis_mockview_container
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  # Bỏ comment để chạy cả app trong Docker
