version: '3.8'

services:
  db_mockview:
    image: mysql:8.0
    container_name: mysql_mockview_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mockview_database
      MYSQL_USER: mockview_user
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis_mockview:
    image: redis:alpine
    container_name: redis_mockview_container
    restart: always

  web_mockview:
    build:
      context: .
      dockerfile: MockviewAI/Dockerfile
    image: mockviewai:dev
    container_name: web_mockview_container
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection
      - ConnectionStrings__RedisConnection
    ports:
      - "8080:8080"
    depends_on:
      db_mockview:
        condition: service_healthy

volumes:
  mysql_data:
