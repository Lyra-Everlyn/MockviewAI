version: '3.8'

services:
  db_mockview:
    image: mysql:8.0
    container_name: mysql_mockview_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: mockview_database
    ports:
      - "127.0.0.1:3306:3306"   # only reachable from this machine, not from the internet
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  # TẠM ẨN WEB CONTAINER TRONG QUÁ TRÌNH DEV
