version: '3.8'

services:
  db_mockview:
    image: mysql:8.0
    container_name: mysql_mockview_container
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: mockview_database
      MYSQL_USER: mockview_user
    volumes:
      - mysql_data_final:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 15

  redis_mockview:
    image: redis:alpine
    container_name: redis_mockview_container
    restart: always

  web_mockview:
    build:
      context: .
      dockerfile: MockviewAI/Dockerfile
    image: mockviewai:dev
    container_name: web_mockview_container
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      db_mockview:
        condition: service_healthy

volumes:
  mysql_data_final:
