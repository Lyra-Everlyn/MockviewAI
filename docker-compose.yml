version: '3.8'

services:
  db_mockview:
    image: mysql:8.0
    container_name: mysql_mockview_container
    restart: always
    environment:
      # Hãy ghi trực tiếp mật khẩu thật của bạn vào đây
      MYSQL_ROOT_PASSWORD: "MatKhauCuaBan123!"
      MYSQL_DATABASE: mockview_database
      MYSQL_USER: mockview_user
      MYSQL_PASSWORD: "MatKhauCuaBan123!"
    volumes:
      - mysql_data_v4:/var/lib/mysql
    networks:
      - dokploy-network

  redis_mockview:
    image: redis:alpine
    container_name: redis_mockview_container
    restart: always
    networks:
      - dokploy-network

volumes:
  mysql_data_v4:

networks:
  dokploy-network:
    external: true
